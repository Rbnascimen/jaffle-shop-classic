name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.0.0", "<2.0.0"]

models:
  jaffle_shop:
      materialized: table
      staging:
        # tabela, nao view: view existe so no metastore, e o dbt-runner tem
        # um Derby proprio, separado do metastore da plataforma. Como Derby
        # embarcado aceita um processo por vez, unificar quebrou todo dbt run
        # em 21/08. Materializando como tabela o arquivo Delta fica em disco e
        # o DQ da plataforma resolve pelo caminho: as 8 regras dos stg_ que
        # falhavam desde maio passaram a rodar.
        materialized: table
